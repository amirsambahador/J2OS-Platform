# Registers report-generator/settings/fonts.xml as a JasperReports font
# extension, making the "Vazirmatn" font family resolvable by name from
# anywhere a report references it - DynamicReportEngine, and any .jrxml
# template.
#
# IMPORTANT: this file itself MUST stay directly under src/main/resources/
# (the classpath root), NOT inside report-generator/ or any other
# subfolder. JasperReports looks it up by the exact name
# "jasperreports_extension.properties" with no path prefix
# (ClassLoader.getResources("jasperreports_extension.properties")) - if
# it's nested in a subfolder, JasperReports simply won't find it and the
# whole Persian font setup silently stops working. The path VALUE below
# (pointing at fonts.xml) can live anywhere, since that one is resolved as
# a normal classpath resource path - only this properties file's own
# location is fixed.
#
# NOTE: if the rest of the CLEAN-BACK project already ships its own
# jasperreports_extension.properties, merge these two lines into that
# existing file instead of having two - JasperReports only loads the first
# one it finds on the classpath.
net.sf.jasperreports.extension.registry.factory.simple.font.families=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.jreportFonts=report-generator/settings/fonts.xml
